<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Peta EBT Indonesia</title>
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:16px/1.4 "Red Hat Text",system-ui,sans-serif;color:#14213d;background:#1b3a5c url(bg.jpg) center/cover no-repeat fixed;
  display:flex;flex-direction:column;align-items:center;min-height:100%;padding:24px 16px}
.logo{width:106px;height:auto;margin-top:0;filter:drop-shadow(0 2px 6px rgba(0,0,0,.25))}
form{width:min(544px,100%);margin:auto 0;display:flex;flex-direction:column;gap:20px;padding:24px 0}
.f{position:relative}
.f svg{position:absolute;left:22px;top:50%;transform:translateY(-50%);width:44px;height:44px;pointer-events:none}
.f input{width:100%;height:82px;border:1px solid #d6dde6;border-radius:6px;background:#fff;padding:0 18px 0 82px;
  font:500 26px "Red Hat Text",system-ui,sans-serif;color:#14213d;box-shadow:0 2px 8px rgba(0,0,0,.15);outline:none}
.f input::placeholder{color:#8a8f98}
.f input:focus{border-color:#1e88e5;box-shadow:0 0 0 3px rgba(30,136,229,.35)}
button{height:80px;border:0;border-radius:6px;background:#03a9f4;color:#fff;font:500 34px "Red Hat Text",system-ui,sans-serif;cursor:pointer;
  box-shadow:0 2px 8px rgba(0,0,0,.2)}
button:hover{background:#0398dc}
button:disabled{opacity:.75;cursor:progress}
.msg{min-height:24px;margin:-6px 0 0;text-align:center;font-weight:600;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.msg.err{color:#fff;background:rgba(198,40,40,.92);border-radius:6px;padding:8px 12px;text-shadow:none}
@media (max-width:600px){
  .logo{width:84px}
  .f input{height:60px;font-size:19px;padding-left:62px}
  .f svg{left:16px;width:32px;height:32px}
  button{height:60px;font-size:24px}
  form{gap:14px}
}
</style>
</head>

<script>
(()=>{
  const V=JSON.parse(document.getElementById("vault").textContent),SK="peta-ebt-key",enc=new TextEncoder();
  const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),to64=u=>btoa(String.fromCharCode(...u));
  const msg=document.getElementById("msg"),btn=document.getElementById("go");
  const say=(t,err)=>{msg.textContent=t;msg.className="msg"+(err?" err":"");};
  if(!window.crypto||!crypto.subtle||!window.DecompressionStream){say("Browser ini tidak mendukung enkripsi. Gunakan Chrome, Edge, Firefox atau Safari versi terbaru.",1);btn.disabled=true;return;}
  async function userId(u){const h=new Uint8Array(await crypto.subtle.digest("SHA-256",enc.encode("peta-ebt|"+u.trim().toLowerCase())));return [...h].map(b=>b.toString(16).padStart(2,"0")).join("");}
  async function unwrap(u,p){
    const e=V.users[await userId(u)]||V.decoy;
    const base=await crypto.subtle.importKey("raw",enc.encode(p),"PBKDF2",false,["deriveKey"]);
    const kek=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(e.s),iterations:V.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
    try{return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(e.i)},kek,b64(e.k)));}catch(_){return null;}
  }
  async function openMap(raw){
    const key=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
    const gz=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(V.iv)},key,b64(V.data));
    const html=await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    document.open();document.write(html);document.close();
  }
  // same browser tab: reopen without asking again until the tab is closed or "Keluar" is pressed
  let saved=null;try{saved=sessionStorage.getItem(SK);}catch(_){}
  if(saved)openMap(b64(saved)).catch(()=>{try{sessionStorage.removeItem(SK);}catch(_){}});
  document.getElementById("login").addEventListener("submit",async ev=>{
    ev.preventDefault();btn.disabled=true;btn.textContent="Memeriksa…";say("");
    try{
      const raw=await unwrap(document.getElementById("u").value,document.getElementById("p").value);
      if(!raw){say("Username atau password salah.",1);return;}
      say("Membuka peta…");try{sessionStorage.setItem(SK,to64(raw));}catch(_){}
      await openMap(raw);
    }catch(e){say("Gagal membuka peta: "+e.message,1);}
    finally{btn.disabled=false;btn.textContent="Log In";}
  });
})();
</script>
